# Release pipeline: version tag → all checks, Pebble .pbw builds, GHCR image,
# and a GitHub release with the compiled watchface + check-in app attached.
# Version tags are plain semantic versions (e.g. 1.0.0) that must equal
# server/pyproject.toml's version (spec/operations.md).

name: release

on:
  push:
    tags: ["*"]
  # Manual releases: tag-event quirks (force-moved tags) don't retrigger the
  # workflow, so a tag can also be dispatched by name. The tag must equal
  # server/pyproject.toml's version — the publish job verifies that.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must equal server/pyproject.toml version)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  pebble-build:
    name: pebble (watchface + check-in app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble toolchain
        run: |
          uv tool install pebble-tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pebble sdk install latest || true  # exits 1 when already installed
      - name: Build watchface
        working-directory: watchface
        run: pebble build
      - name: Build check-in app
        working-directory: app
        run: pebble build
      - name: Upload .pbw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbw
          path: |
            watchface/build/watchface.pbw
            app/build/app.pbw

  publish:
    name: publish (GHCR + release)
    needs: [checks, pebble-build]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag matches package version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('server/pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "${{ env.RELEASE_TAG }}" ]; then
            echo "tag ${{ env.RELEASE_TAG }} != package version $VERSION"; exit 1
          fi
      - name: Download .pbw artifacts
        uses: actions/download-artifact@v4
        with:
          name: pbw
          path: pbw
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      # Idempotent: re-releases (force-moved tags, retried runs) must not fail on
      # an existing release — upload-clobber instead of create.
      - name: Create or update GitHub release with .pbw assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            echo "release ${{ env.RELEASE_TAG }} already exists — replacing assets"
            gh release upload "${{ env.RELEASE_TAG }}" \
              pbw/watchface/build/watchface.pbw \
              pbw/app/build/app.pbw \
              --clobber
          else
            gh release create "${{ env.RELEASE_TAG }}" \
              pbw/watchface/build/watchface.pbw \
              pbw/app/build/app.pbw \
              --generate-notes
          fi