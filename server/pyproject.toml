[project]
name = "guai-hub"
version = "1.6.1"
description = "GUAI self-hosted health platform — server (Gather & Understand)"
readme = "README.md"
authors = [
    { name = "divin", email = "71128266+divin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16.0",
    "fastapi>=0.141.1",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
server = "guai_hub.__main__:main"
guai-hub = "guai_hub.__main__:main"

[project.optional-dependencies]
# Forecasting extra: the Inpriora tabular FM (pinned by commit; HF checkpoint
# revision pinned in guai_hub.forecasting.models.inpriora_model). Optional —
# the server runs and forecasts with baselines when it is not installed.
forecast = [
    "inpriora",
    # Direct torch pin so tool.uv.sources forces the CPU-only index; inpriora
    # itself only requires torch>=2.4 and the CPU index's newest is 2.9.1.
    "torch==2.9.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Wall-clock (naive-local) times are deliberate: schedules are defined in TZ and
# localised only at the boundary, so DTZ007 does not apply to this codebase.
ignore = ["DTZ007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
inpriora = { git = "https://github.com/ai-for-data/inpriora.git", rev = "4b0d403c22100751e38765388273d3f32858d61c" }
# Torch from the CPU-only wheel index: the hub is CPU-only and the CUDA wheels
# pull in gigabytes of NVIDIA libraries for nothing.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
